services:
  postgres:
    image: postgres:16-alpine
    container_name: round-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: round
      POSTGRES_PASSWORD: round
      POSTGRES_DB: round
    ports:
      - "5432:5432"
    volumes:
      - round_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U round -d round"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: round-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://round:round@postgres:5432/round?schema=public
      PORT: 3333
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  round_pg_data:
